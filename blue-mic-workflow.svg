<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" width="1240" height="710" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="The Blue Mic workflow: capture a meeting by recording on the road with the iOS or Android app or by pasting a transcript, run Sales Coach, then sync notes, tasks, and follow-up emails back to your CRM.">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#1E5FE6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <!-- Glossy fill for the two big arrows -->
    <linearGradient id="arrowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A97F9"/>
      <stop offset="48%" stop-color="#2E6BE8"/>
      <stop offset="100%" stop-color="#1B4FD0"/>
    </linearGradient>
    <!-- Soft light band that sweeps through an arrow to signal data flow -->
    <linearGradient id="flowBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EAF3FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="arrowGlow" x="-40%" y="-70%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glowBlur" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="clipA"><path d="M362 339 L420 339 L420 325 L468 355 L420 385 L420 371 L362 371 Z"/></clipPath>
    <clipPath id="clipB"><path d="M775 339 L833 339 L833 325 L881 355 L833 385 L833 371 L775 371 Z"/></clipPath>
  </defs>
  <style>
    /* Static "done" checks shown only when motion is reduced; animated layers hidden. */
    .rm-static { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .comet { display: none; }
      .rm-static { display: inline; }
    }
  </style>

  <!-- Panel -->
  <rect x="1" y="1" width="1238" height="708" rx="28" fill="url(#panelBg)" stroke="#DCE6F7" stroke-width="1.5"/>

  <!-- Sequential section illumination (behind the cards). Each halo blooms on its
       beat of the 10s story: Capture -> Coach -> Sync, then repeats. -->
  <g class="comet" transform="translate(0,80)">
    <g opacity="0">
      <rect x="53" y="234" width="304" height="242" rx="22" fill="#3B82F6" opacity="0.30" filter="url(#glowBlur)"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.005;0.0375;0.215;0.25;1" keySplines="0 0 1 1;0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1;0 0 1 1"/>
    </g>
    <g opacity="0">
      <rect x="468" y="143" width="304" height="424" rx="24" fill="#3B82F6" opacity="0.30" filter="url(#glowBlur)"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.055;0.0875;0.215;0.25;1" keySplines="0 0 1 1;0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1;0 0 1 1"/>
    </g>
    <g opacity="0">
      <rect x="883" y="174" width="304" height="362" rx="22" fill="#3B82F6" opacity="0.30" filter="url(#glowBlur)"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" calcMode="spline" values="0;0;1;1;0;0" keyTimes="0;0.1375;0.175;0.215;0.25;1" keySplines="0 0 1 1;0.42 0 0.58 1;0 0 1 1;0.42 0 0.58 1;0 0 1 1"/>
    </g>
  </g>

  <!-- Header -->
  <text x="620" y="50" text-anchor="middle" font-size="28" font-weight="400" fill="#0B1220" font-family="'Instrument Serif', 'Iowan Old Style', 'Apple Garamond', Georgia, 'Times New Roman', serif">How Blue Mic works</text>
  <text x="620" y="82" text-anchor="middle" font-size="13.5" fill="#5B6478">Blue Mic takes every meeting you record in the field or paste a transcript from another tool and runs it</text>
  <text x="620" y="102" text-anchor="middle" font-size="13.5" fill="#5B6478">through Sales Coach to generate post-meeting wins, priority objectives, coaching suggestions,</text>
  <text x="620" y="122" text-anchor="middle" font-size="13.5" fill="#5B6478">drafted client emails, and sales summary notes, then syncs the notes and tasks to your CRM.</text>

  <!-- Column labels -->
  <g font-size="15" font-weight="700" letter-spacing="1.6" text-anchor="middle">
    <g>
      <rect x="120" y="148" width="170" height="30" rx="15" fill="#E6EEFE"/>
      <text x="205" y="168" fill="#1E5FE6">1 &#183; CAPTURE</text>
    </g>
    <g>
      <rect x="538" y="148" width="164" height="30" rx="15" fill="#E6EEFE"/>
      <text x="620" y="168" fill="#1E5FE6">2 &#183; COACH</text>
    </g>
    <g>
      <rect x="913" y="148" width="244" height="30" rx="15" fill="#E6EEFE"/>
      <text x="1035" y="168" fill="#1E5FE6">3 &#183; SYNC &amp; FOLLOW-UP</text>
    </g>
  </g>

  <g transform="translate(0,80)">
  <!-- Connectors (drawn first, under the cards' edges) -->
  <!-- Two big arrows: Capture -> Coach and Coach -> Sync. A soft light band sweeps
       through each on its beat to signal data passing left to right. -->
  <!-- Arrow A: Capture -> Coach -->
  <path d="M362 339 L420 339 L420 325 L468 355 L420 385 L420 371 L362 371 Z" fill="#2E6BE8" opacity="0.30" filter="url(#arrowGlow)"/>
  <path d="M362 339 L420 339 L420 325 L468 355 L420 385 L420 371 L362 371 Z" fill="url(#arrowFill)"/>
  <g class="comet" clip-path="url(#clipA)">
    <rect x="356" y="315" width="46" height="80" fill="url(#flowBand)" opacity="0">
      <animateTransform attributeName="transform" type="translate" dur="40s" repeatCount="indefinite" keyTimes="0;0.015;0.075;0.25;1" values="-45 0;-45 0;115 0;115 0;115 0"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="0;0;0.9;0.9;0;0;0" keyTimes="0;0.015;0.02125;0.06875;0.075;0.25;1"/>
    </rect>
  </g>
  <!-- Arrow B: Coach -> Sync -->
  <path d="M775 339 L833 339 L833 325 L881 355 L833 385 L833 371 L775 371 Z" fill="#2E6BE8" opacity="0.30" filter="url(#arrowGlow)"/>
  <path d="M775 339 L833 339 L833 325 L881 355 L833 385 L833 371 L775 371 Z" fill="url(#arrowFill)"/>
  <g class="comet" clip-path="url(#clipB)">
    <rect x="769" y="315" width="46" height="80" fill="url(#flowBand)" opacity="0">
      <animateTransform attributeName="transform" type="translate" dur="40s" repeatCount="indefinite" keyTimes="0;0.1175;0.1775;0.25;1" values="-45 0;-45 0;115 0;115 0;115 0"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="0;0;0.9;0.9;0;0;0" keyTimes="0;0.1175;0.12375;0.17125;0.1775;0.25;1"/>
    </rect>
  </g>

  <!-- ============ Column A: Capture ============ -->
  <!-- A1 Record on the road -->
  <rect x="60" y="241" width="290" height="104" rx="16" fill="#FFFFFF" stroke="#DCE6F7" stroke-width="1.5"/>
  <circle cx="105" cy="293" r="24" fill="#E6EEFE"/>
  <g transform="translate(105,293)" fill="none" stroke="#1E5FE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-5" y="-11" width="10" height="14" rx="5"/>
    <path d="M-8 -1 a8 8 0 0 0 16 0"/>
    <line x1="0" y1="7" x2="0" y2="11"/>
    <line x1="-4" y1="11" x2="4" y2="11"/>
  </g>
  <text x="146" y="287" font-size="16" font-weight="700" fill="#0B1220">Record on the road</text>
  <text x="146" y="309" font-size="12.5" fill="#5B6478">Blue Mic app &#183; iOS &amp; Android</text>

  <!-- A2 Paste a transcript -->
  <rect x="60" y="365" width="290" height="104" rx="16" fill="#FFFFFF" stroke="#DCE6F7" stroke-width="1.5"/>
  <circle cx="105" cy="417" r="24" fill="#E6EEFE"/>
  <g transform="translate(105,417)" fill="none" stroke="#1E5FE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-8" y="-10" width="16" height="20" rx="2.5"/>
    <line x1="-4" y1="-4" x2="4" y2="-4"/>
    <line x1="-4" y1="0" x2="4" y2="0"/>
    <line x1="-4" y1="4" x2="1" y2="4"/>
  </g>
  <text x="146" y="411" font-size="16" font-weight="700" fill="#0B1220">Paste a transcript</text>
  <text x="146" y="433" font-size="12.5" fill="#5B6478">From any meeting tool</text>

  <!-- ============ Column B: Sales Coach ============ -->
  <rect x="475" y="150" width="290" height="410" rx="20" fill="#FFFFFF" stroke="#DCE6F7" stroke-width="1.5"/>
  <text x="620" y="188" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#1E5FE6">BLUE MIC</text>
  <text x="620" y="212" text-anchor="middle" font-size="21" font-weight="700" fill="#0B1220">Sales Coach</text>

  <!-- 5 process pills -->
  <g>
    <!-- pill 1 -->
    <rect x="495" y="238" width="250" height="48" rx="12" fill="#EAF1FB"/>
    <g class="rm-static"><circle cx="520" cy="262" r="11" fill="#34C759"/><path d="M515 262 l3.2 3.2 L525 258.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="comet" transform="translate(521,262)" fill="#1E5FE6">
      <path d="M0.5 -5.8 L1.75 -1.25 L6.3 0 L1.75 1.25 L0.5 5.8 L-0.75 1.25 L-5.3 0 L-0.75 -1.25 Z"/>
      <path d="M-5 -7 L-4.45 -5.05 L-2.5 -4.5 L-4.45 -3.95 L-5 -2 L-5.55 -3.95 L-7.5 -4.5 L-5.55 -5.05 Z"/>
      <path d="M-4.5 2.6 L-4.08 4.08 L-2.6 4.5 L-4.08 4.92 L-4.5 6.4 L-4.92 4.92 L-6.4 4.5 L-4.92 4.08 Z"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.0625;0.075;0.9;1"/>
    </g>
    <g class="comet" opacity="0"><circle cx="520" cy="262" r="11" fill="#34C759"/><path d="M515 262 l3.2 3.2 L525 258.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0625;0.075;0.9;1"/>
    </g>
    <text x="543" y="258" font-size="13.5" font-weight="700" fill="#0B1220">Sales Summary Notes</text>
    <text x="543" y="274" font-size="11" fill="#5B6478">Reviewed &amp; sent to your CRM</text>

    <!-- pill 2 -->
    <rect x="495" y="300" width="250" height="48" rx="12" fill="#EAF1FB"/>
    <g class="rm-static"><circle cx="520" cy="324" r="11" fill="#34C759"/><path d="M515 324 l3.2 3.2 L525 320.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="comet" transform="translate(521,324)" fill="#1E5FE6">
      <path d="M0.5 -5.8 L1.75 -1.25 L6.3 0 L1.75 1.25 L0.5 5.8 L-0.75 1.25 L-5.3 0 L-0.75 -1.25 Z"/>
      <path d="M-5 -7 L-4.45 -5.05 L-2.5 -4.5 L-4.45 -3.95 L-5 -2 L-5.55 -3.95 L-7.5 -4.5 L-5.55 -5.05 Z"/>
      <path d="M-4.5 2.6 L-4.08 4.08 L-2.6 4.5 L-4.08 4.92 L-4.5 6.4 L-4.92 4.92 L-6.4 4.5 L-4.92 4.08 Z"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.075;0.0875;0.9;1"/>
    </g>
    <g class="comet" opacity="0"><circle cx="520" cy="324" r="11" fill="#34C759"/><path d="M515 324 l3.2 3.2 L525 320.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.075;0.0875;0.9;1"/>
    </g>
    <text x="543" y="320" font-size="13.5" font-weight="700" fill="#0B1220">Priority Objectives</text>
    <text x="543" y="336" font-size="11" fill="#5B6478">Problem &#183; Impact &#183; Point of View</text>

    <!-- pill 3 -->
    <rect x="495" y="362" width="250" height="48" rx="12" fill="#EAF1FB"/>
    <g class="rm-static"><circle cx="520" cy="386" r="11" fill="#34C759"/><path d="M515 386 l3.2 3.2 L525 382.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="comet" transform="translate(521,386)" fill="#1E5FE6">
      <path d="M0.5 -5.8 L1.75 -1.25 L6.3 0 L1.75 1.25 L0.5 5.8 L-0.75 1.25 L-5.3 0 L-0.75 -1.25 Z"/>
      <path d="M-5 -7 L-4.45 -5.05 L-2.5 -4.5 L-4.45 -3.95 L-5 -2 L-5.55 -3.95 L-7.5 -4.5 L-5.55 -5.05 Z"/>
      <path d="M-4.5 2.6 L-4.08 4.08 L-2.6 4.5 L-4.08 4.92 L-4.5 6.4 L-4.92 4.92 L-6.4 4.5 L-4.92 4.08 Z"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.0875;0.1;0.9;1"/>
    </g>
    <g class="comet" opacity="0"><circle cx="520" cy="386" r="11" fill="#34C759"/><path d="M515 386 l3.2 3.2 L525 382.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0875;0.1;0.9;1"/>
    </g>
    <text x="543" y="382" font-size="13.5" font-weight="700" fill="#0B1220">Post-Meeting Wins</text>
    <text x="543" y="398" font-size="11" fill="#5B6478">Top 3 wins from the call</text>

    <!-- pill 4 -->
    <rect x="495" y="424" width="250" height="48" rx="12" fill="#EAF1FB"/>
    <g class="rm-static"><circle cx="520" cy="448" r="11" fill="#34C759"/><path d="M515 448 l3.2 3.2 L525 444.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="comet" transform="translate(521,448)" fill="#1E5FE6">
      <path d="M0.5 -5.8 L1.75 -1.25 L6.3 0 L1.75 1.25 L0.5 5.8 L-0.75 1.25 L-5.3 0 L-0.75 -1.25 Z"/>
      <path d="M-5 -7 L-4.45 -5.05 L-2.5 -4.5 L-4.45 -3.95 L-5 -2 L-5.55 -3.95 L-7.5 -4.5 L-5.55 -5.05 Z"/>
      <path d="M-4.5 2.6 L-4.08 4.08 L-2.6 4.5 L-4.08 4.92 L-4.5 6.4 L-4.92 4.92 L-6.4 4.5 L-4.92 4.08 Z"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.1;0.1125;0.9;1"/>
    </g>
    <g class="comet" opacity="0"><circle cx="520" cy="448" r="11" fill="#34C759"/><path d="M515 448 l3.2 3.2 L525 444.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1;0.1125;0.9;1"/>
    </g>
    <text x="543" y="444" font-size="13.5" font-weight="700" fill="#0B1220">Coaching Suggestions</text>
    <text x="543" y="460" font-size="11" fill="#5B6478">What was missed or could improve</text>

    <!-- pill 5 -->
    <rect x="495" y="486" width="250" height="48" rx="12" fill="#EAF1FB"/>
    <g class="rm-static"><circle cx="520" cy="510" r="11" fill="#34C759"/><path d="M515 510 l3.2 3.2 L525 506.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="comet" transform="translate(521,510)" fill="#1E5FE6">
      <path d="M0.5 -5.8 L1.75 -1.25 L6.3 0 L1.75 1.25 L0.5 5.8 L-0.75 1.25 L-5.3 0 L-0.75 -1.25 Z"/>
      <path d="M-5 -7 L-4.45 -5.05 L-2.5 -4.5 L-4.45 -3.95 L-5 -2 L-5.55 -3.95 L-7.5 -4.5 L-5.55 -5.05 Z"/>
      <path d="M-4.5 2.6 L-4.08 4.08 L-2.6 4.5 L-4.08 4.92 L-4.5 6.4 L-4.92 4.92 L-6.4 4.5 L-4.92 4.08 Z"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.1125;0.125;0.9;1"/>
    </g>
    <g class="comet" opacity="0"><circle cx="520" cy="510" r="11" fill="#34C759"/><path d="M515 510 l3.2 3.2 L525 506.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" dur="40s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1125;0.125;0.9;1"/>
    </g>
    <text x="543" y="506" font-size="13.5" font-weight="700" fill="#0B1220">Draft Client Emails</text>
    <text x="543" y="522" font-size="11" fill="#5B6478">+ follow-up task to your CRM</text>
  </g>

  <!-- ============ Column C: Sync & follow up ============ -->
  <!-- C1 Summary notes -->
  <rect x="890" y="181" width="290" height="104" rx="16" fill="#FFFFFF" stroke="#DCE6F7" stroke-width="1.5"/>
  <circle cx="935" cy="233" r="24" fill="#E6EEFE"/>
  <g transform="translate(935,233)" fill="none" stroke="#1E5FE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-8" y1="-6" x2="6" y2="-6"/>
    <line x1="-8" y1="-1" x2="6" y2="-1"/>
    <line x1="-8" y1="4" x2="0" y2="4"/>
    <path d="M2 5 l3 3 l6 -7.5"/>
  </g>
  <text x="976" y="228" font-size="15.5" font-weight="700" fill="#0B1220">CRM Summary Notes</text>
  <text x="976" y="249" font-size="11" fill="#5B6478">Written for the rep, synced to CRM</text>

  <!-- C2 Tasks & reminders -->
  <rect x="890" y="303" width="290" height="104" rx="16" fill="#FFFFFF" stroke="#DCE6F7" stroke-width="1.5"/>
  <circle cx="935" cy="355" r="24" fill="#E6EEFE"/>
  <g transform="translate(935,355)" fill="none" stroke="#1E5FE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-8" y="-9" width="16" height="18" rx="2.5"/>
    <path d="M-4 -3 l2 2 l4 -4"/>
    <line x1="-2" y1="5" x2="5" y2="5"/>
  </g>
  <text x="976" y="350" font-size="15.5" font-weight="700" fill="#0B1220">Tasks &amp; Reminders</text>
  <text x="976" y="371" font-size="11" fill="#5B6478">So follow-ups don&#8217;t slip</text>

  <!-- C3 Follow-up emails -->
  <rect x="890" y="425" width="290" height="104" rx="16" fill="#FFFFFF" stroke="#DCE6F7" stroke-width="1.5"/>
  <circle cx="935" cy="477" r="24" fill="#E6EEFE"/>
  <g transform="translate(935,477)" fill="none" stroke="#1E5FE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-9" y="-7" width="18" height="14" rx="2.5"/>
    <path d="M-9 -6 L0 2 L9 -6"/>
  </g>
  <text x="976" y="472" font-size="15.5" font-weight="700" fill="#0B1220">Follow-up Emails</text>
  <text x="976" y="493" font-size="11" fill="#5B6478">Drafted from the meeting</text>


  </g>
</svg>
